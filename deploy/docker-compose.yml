services:
  api:
    build:
      context: ..
    command: ["serve", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      DAYTHREAD_HOME: /data
    volumes:
      - daythread-data:/data
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dt", "doctor"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - daythread-data:/data:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  relay:
    build:
      context: ..
    command: ["relay", "serve", "--host", "0.0.0.0", "--port", "8788", "--retention-days", "30"]
    environment:
      DAYTHREAD_HOME: /data
      DAYTHREAD_RELAY_TOKEN: ${DAYTHREAD_RELAY_TOKEN:?set a relay token}
    volumes:
      - relay-data:/data/relay
    ports:
      - "127.0.0.1:8788:8788"
    restart: unless-stopped

volumes:
  daythread-data:
  relay-data:
