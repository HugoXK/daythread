[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daythread"
version = "0.23.0"
description = "Local-first, auditable personal agent baseline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Hugo Xu" }]
keywords = ["personal-agent", "local-first", "memory", "audit", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=37"]
dev = ["coverage>=7", "ruff>=0.6"]
sidecar = ["pyinstaller>=6"]

[project.scripts]
dt = "daythread.cli:main"

[project.urls]
Design = "../docs/daythread-design.md"

[tool.setuptools.packages.find]
include = ["daythread*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.package-data]
daythread = ["py.typed"]
