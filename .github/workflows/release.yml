name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[crypto,dev]"
      - name: Lint
        run: python -m ruff check daythread tests scripts
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build and sign
        env:
          DAYTHREAD_SIGNING_KEY: ${{ secrets.DAYTHREAD_SIGNING_KEY }}
        run: |
          if [ -n "$DAYTHREAD_SIGNING_KEY" ]; then
            echo "$DAYTHREAD_SIGNING_KEY" | base64 -d > release.pem
            python scripts/release.py --build --signing-key release.pem
            python scripts/attest.py --dist dist --signing-key release.pem
          else
            python scripts/release.py --build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: daythread-dist
          path: dist
