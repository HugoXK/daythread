name: review-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number (empty = every open pull request)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-gate-runner:
    name: review-gate-runner
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require the reviewer PASS at the tip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEWER_LOGIN: HugoXK-bot
          PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr || '' }}
        run: |
          if [ ! -f .github/scripts/review_gate.py ]; then
            echo "review-gate: bootstrap (script is not on the base branch yet)"
            exit 0
          fi
          python3 .github/scripts/review_gate.py
