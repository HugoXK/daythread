name: review-request

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  request:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const isPR = Boolean(context.payload.pull_request);
            const number = isPR
              ? context.payload.pull_request.number
              : context.payload.issue.number;
            const kind = isPR ? "pull request" : "issue";
            try {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: number, assignees: ["HugoXK-bot"],
              });
            } catch (error) {
              core.warning(`could not assign HugoXK-bot: ${error.message}`);
            }
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: number, per_page: 100,
            });
            const alreadyRequested = comments.data.some((comment) =>
              (comment.body || "").includes("@HugoXK-bot")
            );
            if (!alreadyRequested) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `@HugoXK-bot please review this ${kind}.\n\nReviewer policy: a PASS must be posted at the current head SHA before merge.`,
              });
            }
