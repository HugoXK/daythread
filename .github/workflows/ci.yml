name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[crypto,dev]"
      - name: Compile
        run: python -m compileall -q daythread tests
      - name: Coverage
        run: |
          python -m coverage run --source=daythread -m unittest discover -s tests -v
          python -m coverage report -m
